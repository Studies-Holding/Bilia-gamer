<!DOCTYPE html>
<!--
  ================================================================
  BILIA-V4 — dev-template/index.html
  Template de base pour développeurs tiers
  Le jeu s'exécute à 100% dans l'iframe BiLiA
  ================================================================
-->
<html lang="fr" data-theme="SuperShane">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Mon Jeu BiLiA</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Zone de jeu — s'étend à 100% de l'iframe -->
  <div id="game-root">
    <canvas id="game-canvas"></canvas>

    <!-- UI overlay -->
    <div id="ui-overlay">
      <div id="score-display" aria-live="polite" aria-label="Score actuel">0</div>
    </div>

    <!-- Écran de démarrage -->
    <div id="start-screen">
      <div class="start-card">
        <div id="game-icon" aria-hidden="true">🎮</div>
        <h1 id="game-title">Mon Jeu</h1>
        <p id="game-desc" class="desc">Prêt à jouer ?</p>
        <button id="start-btn" class="btn-primary" aria-label="Démarrer la partie">
          <span aria-hidden="true">▶</span> JOUER
        </button>
      </div>
    </div>

    <!-- Écran Game Over -->
    <div id="gameover-screen" hidden>
      <div class="start-card">
        <div id="result-icon" aria-hidden="true">🏆</div>
        <h2 id="result-title">Partie terminée</h2>
        <p id="result-score" aria-live="polite">Score : 0</p>
        <button id="replay-btn" class="btn-primary" aria-label="Rejouer">
          🔄 Rejouer
        </button>
      </div>
    </div>

    <!-- Écran non autorisé (affiché si isAuthorized() = false) -->
    <div id="unauthorized-screen" hidden>
      <div class="start-card">
        <div aria-hidden="true" style="font-size:4rem;margin-bottom:1rem">🔒</div>
        <h2>Demande à tes parents !</h2>
        <p class="desc">Ce jeu n'est pas encore installé.<br>Demande à un parent de l'approuver.</p>
      </div>
    </div>
  </div>

  <!-- SDK BiLiA — fourni par la plateforme -->
  <script src="/sdk/bilia-sdk.js"></script>
  <!-- Logique du jeu -->
  <script type="module" src="src/main.js"></script>
</body>
</html>
