# ================================================================
#  BILIA-V4 — gateway/nginx.conf
#  Routage : vitrine / parent / enfant / API / Socket.io / jeux
# ================================================================

events { worker_connections 2048; }

http {
  include      /etc/nginx/mime.types;
  default_type application/octet-stream;

  # ── Logs ───────────────────────────────────────────────────────
  log_format main '$remote_addr [$time_local] "$request" $status $body_bytes_sent "$http_user_agent"';
  access_log /var/log/nginx/access.log main;
  error_log  /var/log/nginx/error.log  warn;

  # ── Optim ──────────────────────────────────────────────────────
  sendfile on; tcp_nopush on; keepalive_timeout 65;
  client_max_body_size 55m;    # upload jeux jusqu'à 50MB
  gzip on;
  gzip_types text/plain text/css application/json application/javascript
             text/xml application/xml application/wasm text/javascript
             application/manifest+json;

  # ── Upstreams ──────────────────────────────────────────────────
  upstream auth   { server auth-service:5001;   keepalive 16; }
  upstream core   { server core-service:5002;   keepalive 16; }
  upstream game   { server game-service:5003;   keepalive 16; }
  upstream socket { server socket-service:5004; keepalive 32; }

  # ── HTTP → HTTPS ───────────────────────────────────────────────
  server {
    listen 80 default_server;
    server_name _;
    return 301 https://$host$request_uri;
  }

  # ── SITE VITRINE — votre-domaine.com ──────────────────────────
  server {
    listen 443 ssl http2;
    server_name VOTRE_DOMAINE.com www.VOTRE_DOMAINE.com;

    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    root  /var/www/landing;
    index index.html;

    location ~* \.(js|css|png|jpg|svg|ico|woff2|webp)$ {
      expires 1y; add_header Cache-Control "public, immutable";
    }
    location / { try_files $uri $uri/ /index.html; }
  }

  # ── PWA ENFANT — bilia.votre-domaine.com ──────────────────────
  server {
    listen 443 ssl http2;
    server_name bilia.VOTRE_DOMAINE.com;

    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    root  /var/www/child;
    index index.html;

    # Headers sécurité PWA
    add_header X-Frame-Options         "SAMEORIGIN"                   always;
    add_header X-Content-Type-Options  "nosniff"                      always;
    add_header Referrer-Policy         "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy      "camera=(), vibrate=(self)"    always;
    add_header Strict-Transport-Security "max-age=31536000"           always;

    # Service Worker — no-cache impératif
    location = /sw.js {
      add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
    # Manifest PWA
    location = /manifest.webmanifest {
      add_header Content-Type  "application/manifest+json";
      add_header Cache-Control "public, max-age=86400";
    }

    # SDK — accès public CORS
    location /sdk/ {
      root /var/www/child;
      add_header Access-Control-Allow-Origin "*";
      add_header Cache-Control "public, max-age=86400";
    }

    # Jeux stockés
    location /games/ {
      root /var/www;
      add_header Cache-Control "public, max-age=2592000";
      try_files $uri $uri/ =404;
    }

    # API Auth
    location ~ ^/api/(auth|profiles) {
      proxy_pass http://auth;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API Core (scores, shop, themes, analytics)
    location ~ ^/api/(scores|shop|themes|analytics) {
      proxy_pass http://core;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    # API Game (catalogue, downloads)
    location ~ ^/api/(games|downloads) {
      proxy_pass         http://game;
      proxy_set_header   Host $host;
      proxy_read_timeout 60s;
    }

    # API Time Guard
    location /api/time {
      proxy_pass http://socket;
      proxy_set_header Host $host;
    }

    # Socket.io — WebSocket upgrade
    location /socket.io/ {
      proxy_pass         http://socket;
      proxy_http_version 1.1;
      proxy_set_header   Upgrade    $http_upgrade;
      proxy_set_header   Connection "upgrade";
      proxy_set_header   Host       $host;
      proxy_read_timeout 86400;
    }

    # Assets longs — cache 1 an
    location ~* \.(js|css|png|jpg|jpeg|svg|ico|woff2|webp|mp3|wav|ogg)$ {
      expires 1y; add_header Cache-Control "public, immutable";
    }

    # SPA fallback
    location / { try_files $uri $uri/ /index.html; }
  }

  # ── PORTAIL PARENT — parent.votre-domaine.com ─────────────────
  server {
    listen 443 ssl http2;
    server_name parent.VOTRE_DOMAINE.com;

    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;

    root  /var/www/parent;
    index index.html;

    # CSP renforcée pour l'espace parent
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://fonts.googleapis.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com; font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com; img-src 'self' data: blob:; connect-src 'self' wss://parent.VOTRE_DOMAINE.com;" always;

    location ~ ^/api/(auth|profiles) { proxy_pass http://auth; proxy_set_header Host $host; }
    location ~ ^/api/(scores|shop|themes|analytics) { proxy_pass http://core; proxy_set_header Host $host; }
    location ~ ^/api/(games|downloads) { proxy_pass http://game; proxy_set_header Host $host; }
    location /api/time { proxy_pass http://socket; proxy_set_header Host $host; }

    location /socket.io/ {
      proxy_pass         http://socket;
      proxy_http_version 1.1;
      proxy_set_header   Upgrade    $http_upgrade;
      proxy_set_header   Connection "upgrade";
      proxy_set_header   Host       $host;
    }

    location ~* \.(js|css|png|jpg|svg|ico|woff2)$ { expires 1y; add_header Cache-Control "public, immutable"; }
    location / { try_files $uri $uri/ /index.html; }
  }
}
